# =============================================================================
# DEPLOY DA ORTUS PIXEL — build Linux -> push em `deploy-standalone`.
#
# POR QUE EXISTE: o site é servido pela Hostinger a partir da branch
# `deploy-standalone`, que guarda o artefato COMPILADO do Next.js (`.next/`,
# `next-server.js`, `node_modules/` traçado com sharp/engine Linux). A Hostinger
# NÃO builda (o package.json da branch tem `"build":"echo already-built"`) —
# ela só promove a árvore no push. O build precisa acontecer em LINUX porque o
# Next/Prisma embarcam binários nativos; build no Windows gera binários Windows
# (`.node` do sharp e `outputFileTracingRoot="R:\\Claudio"` no next-server.js)
# que CRASHAM no Linux do servidor.
#
# DISPARO: manual (`workflow_dispatch`). O site só muda quando o editor chama
# "Run workflow" aqui. Sem push automático (economiza minutos de Actions).
# =============================================================================
name: deploy-standalone

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------------- (1)
      # Check-out do CÓDIGO-FONTE (main). É daqui que vem apps/, packages/,
      # services/. Nome da pasta: `src`.
      - name: Checkout fonte (main)
        uses: actions/checkout@v4
        with:
          path: src
          ref: main
          fetch-depth: 1

      # ---------------------------------------------------------------- (2)
      # Node 20 = piso do projeto (mesmo NODE_ALVO do build do curator).
      # cache: npm, lockfile raiz `src/package-lock.json`.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/package-lock.json

      # ---------------------------------------------------------------- (3)
      # Instala conforme o lockfile. O postinstall de apps/web roda
      # `npx prisma generate` e gera o client + engine debian-openssl-1.1.x
      # (binaryTarget do schema) — base do `vendor/` e do curator.
      - name: Instalar dependências
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.ORTUS_DATABASE_URL }}
        run: npm ci

      # ---------------------------------------------------------------- (4)
      # Build do WEB (Next standalone). NEXT_OUTPUT_STANDALONE=1 liga
      # `output:'standalone'` no next.config.ts. As env de BUILD são:
      #   DATABASE_URL (secret; necessário p/ rotas que tocam banco no build)
      #   NEXT_PUBLIC_SITE_URL (senão canonical/sitemap sai com localhost)
      # DEEPSEEK_API_KEY fica VAZIA no build de propósito: o botão de
      # pré-matéria só aparece quando a key existe no runtime do hPanel.
      - name: Build do web (Next standalone)
        working-directory: src/apps/web
        env:
          DATABASE_URL: ${{ secrets.ORTUS_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: https://ortuspixel.com
          NEXT_OUTPUT_STANDALONE: '1'
        run: npx next build

      # ---------------------------------------------------------------- (5)
      # Build do CURATOR (bundle .cjs). O script embarca o engine PROD
      # debian-openssl-1.1.x. Roda na raiz do monorepo.
      - name: Build do curator
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.ORTUS_DATABASE_URL }}
        run: node services/curator/scripts/build.mjs

      # ---------------------------------------------------------------- (6)
      # Check-out da branch de DESTINO (deploy-standalone) numa pasta separada.
      # É o artefato atual que recebe o overlay mínimo. Nome: `deploy`.
      - name: Checkout destino (deploy-standalone)
        uses: actions/checkout@v4
        with:
          path: deploy
          ref: deploy-standalone
          fetch-depth: 1

      # ---------------------------------------------------------------- (7)
      # Copia os artefatos do build para caminhos fixos que o script espera.
      # O script (8) valida a existência de cada um antes de tocar na árvore.
      # WEB_STATIC é separado de APPS_WEB_BUILD porque o output standalone do
      # Next NÃO inclui `.next/static/` (comportamento documentado — CSS/JS
      # ficam de fora do bundle standalone de propósito); sem este passo os
      # chunks/CSS somem no deploy e o navegador recebe 404 no lugar deles.
      # DOT_PRISMA_CLIENT / AT_PRISMA_CLIENT: o Prisma Client de verdade que a
      # Hostinger serve não vem do `node_modules` normal — ele é restaurado a
      # cada processo a partir de `vendor/dot-prisma-client/` e
      # `vendor/at-prisma-client/` na branch deploy-standalone (ver o
      # cabeçalho de `server.js` NAQUELA branch: o `npm install` da Hostinger
      # roda sem lockfile e deixa só stubs, então o CÓDIGO gerado do client
      # precisa vir de algum lugar estável — esse vendor/).
      #
      # ⚠ HISTÓRICO DE INCIDENTE (dois, na mesma sessão): a primeira vez que
      # isto foi automatizado, o `find` usava só `-path '*/@prisma/client'` e
      # `head -n1` — e pegou, sem avisar, uma pasta STUB do próprio
      # `@prisma/client` (o placeholder que o pacote cria quando `prisma
      # generate` ainda não rodou naquele node_modules específico: só
      # `default.js`/`package.json`/`runtime/`, SEM `index.js`). O `vendor/`
      # foi sobrescrito com esse stub, e toda consulta no site derrubou até
      # ser revertido à mão. A causa: o output standalone do Next, ao traçar
      # um monorepo, pode conter MAIS DE UMA pasta `@prisma/client` (a
      # hoisted de verdade e cópias parciais/stub de outros pontos da árvore
      # de dependências) — `head -n1` confia na ORDEM do `find`, que não tem
      # nenhuma garantia de escolher a certa.
      #
      # A busca abaixo é blindada contra o mesmo erro: só aceita candidato
      # que TENHA `index.js` (o stub não tem — é o sinal mais barato e mais
      # direto de "isto foi gerado de verdade"), e entre os que sobrarem
      # pega o de MAIOR `index.js` (o client real embala o DMMF do schema
      # inteiro e é sempre ordens de magnitude maior que qualquer stub
      # parcial). Falha ALTO E CEDO se nada passar no filtro — silenciar
      # aqui é exatamente o que causou os dois incidentes.
      - name: Preparar artefatos para overlay
        run: |
          cp -r src/apps/web/.next/standalone/apps/web  APPS_WEB_BUILD
          cp -r src/apps/web/.next/static                   WEB_STATIC
          cp -r src/services/curator/dist                  CURATOR_DIST
          cp -r src/apps/web/public                         WEB_PUBLIC
          mkdir -p PRISMA_SCHEMA
          cp    src/packages/db/prisma/schema.prisma        PRISMA_SCHEMA/schema.prisma

          find_real_client() {
            # $1 = padrão de caminho a procurar (ex.: '*/.prisma/client').
            # `-printf '%s %p'` (não `ls -la` + `awk`) de propósito: o
            # formato de coluna do `ls` varia por sistema/locale, e um script
            # que depende da posição exata de uma coluna é frágil bem quando
            # menos se espera. `-printf` do GNU find imprime tamanho e
            # caminho direto, sem parsing de texto de outro programa.
            find src/apps/web/.next/standalone -type f -path "$1/index.js" -printf '%s %p\n' \
              | sort -rn \
              | head -n1 \
              | cut -d' ' -f2- \
              | xargs -r dirname
          }

          DOT_PRISMA_SRC="$(find_real_client '*/.prisma/client')"
          AT_PRISMA_SRC="$(find_real_client '*/@prisma/client')"

          if [ -z "$DOT_PRISMA_SRC" ] || [ -z "$AT_PRISMA_SRC" ]; then
            echo "::error::Nenhum Prisma Client com index.js encontrado no output standalone (só stub, ou nada). DOT='$DOT_PRISMA_SRC' AT='$AT_PRISMA_SRC'"
            exit 1
          fi

          # Confere que o schema ATUAL está de fato embarcado — não só que
          # "algum" index.js existe, mas que é o gerado a partir do commit
          # deste build. `reactionCount` é um campo recém-adicionado; se ele
          # não aparecer aqui, o client encontrado está desatualizado e o
          # site vai quebrar exatamente como nos dois incidentes anteriores.
          if ! grep -q "reactionCount" "${DOT_PRISMA_SRC}/index.js"; then
            echo "::error::Prisma Client encontrado em ${DOT_PRISMA_SRC} não contém o schema atual (campo 'reactionCount' ausente). Abortando em vez de publicar um client desatualizado."
            exit 1
          fi

          echo "[overlay] Prisma Client traçado (verificado): DOT=$DOT_PRISMA_SRC AT=$AT_PRISMA_SRC"
          cp -r "$DOT_PRISMA_SRC" DOT_PRISMA_CLIENT
          cp -r "$AT_PRISMA_SRC"  AT_PRISMA_CLIENT

      # ---------------------------------------------------------------- (8)
      # Monta a árvore final: overlay mínimo em cima da branch deploy.
      # O script preserva vendor/, server.js, package.json e node_modules/.
      - name: Montar árvore deploy-standalone
        run: bash src/scripts/build-standalone-release.sh

      # ---------------------------------------------------------------- (9)
      # Commit + push na branch deploy-standalone. Usa o PAT (RELEASE_PAT,
      # escopo repo+workflow) porque o GITHUB_TOKEN não re-dispara workflow.
      # Commit NOVO (não force-push sobre o vivo).
      - name: Commit e push do artefato
        working-directory: deploy
        run: |
          git config user.name  "ortus-deploy-bot"
          git config user.email "deploy@ortuspixel.com"
          git add -A
          if git diff --cached --quiet; then
            echo "sem mudanças — nada a commitar"
            exit 0
          fi
          git commit -m "Deploy: artefato buildado em Linux (${{ github.run_id }})"
          git push https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/Subcarioca/ortus-pixel.git deploy-standalone
