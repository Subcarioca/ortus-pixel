# =============================================================================
# Ortus Pixel — Nginx (reverse proxy para ortuspixel.com)
# =============================================================================
#
# INSTALAÇÃO NO VPS (Ubuntu/Debian):
#
#   sudo cp nginx/ortuspixel.conf /etc/nginx/sites-available/ortuspixel.conf
#   sudo ln -s /etc/nginx/sites-available/ortuspixel.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # remove o "Welcome to nginx"
#   sudo nginx -t                                   # SEMPRE validar antes
#   sudo systemctl reload nginx
#
# -----------------------------------------------------------------------------
# ORDEM DE BOOTSTRAP — o problema do ovo e da galinha do TLS
# -----------------------------------------------------------------------------
# Este arquivo referencia certificados em /etc/letsencrypt/live/ortuspixel.com/.
# Se você instalá-lo ANTES de emitir o certificado, o `nginx -t` falha com
# "cannot load certificate ... No such file or directory" e o Nginx não sobe.
#
# A ordem correta é:
#
#   1. Aponte o DNS (registro A de ortuspixel.com e www) para o IP do VPS e
#      espere propagar. Confira: `dig +short ortuspixel.com`
#   2. Suba o Nginx com o `default` ainda ativo (só HTTP) e emita o certificado:
#        sudo certbot certonly --nginx -d ortuspixel.com -d www.ortuspixel.com
#      (`certonly` = só emite, não reescreve config — assim ESTE arquivo
#       continua sendo a fonte da verdade e não é editado por robô)
#   3. Só então instale este arquivo e recarregue.
#
# O certificado cobre os DOIS nomes: um certificado só para o apex faria o
# navegador mostrar aviso de segurança em www antes mesmo do nosso redirect.

# -----------------------------------------------------------------------------
# UPSTREAM — onde a aplicação escuta
# -----------------------------------------------------------------------------
# Vale para os DOIS caminhos de deploy:
#   - PM2:    o Next escuta em 127.0.0.1:3000 (ver ecosystem.config.js)
#   - Docker: o compose publica em 127.0.0.1:3000 (ver docker-compose.prod.yml)
# Ou seja, trocar de caminho não exige tocar no Nginx.
upstream ortuspixel_app {
    server 127.0.0.1:3000;

    # Mantém conexões vivas com o Node em vez de abrir uma por requisição.
    # Num portal de notícias sob pico, o custo de handshake TCP repetido é real:
    # é a diferença entre servir o pico e esgotar portas efêmeras do host.
    keepalive 32;
}

# -----------------------------------------------------------------------------
# LIMITE DE TAXA
# -----------------------------------------------------------------------------
# O app já tem rate limiting próprio (login do painel, newsletter), mas ele é
# EM MEMÓRIA e roda DEPOIS de o Node aceitar e processar a requisição. Este
# limite aqui é a camada anterior: barra a enxurrada antes de custar CPU de
# Node. As duas camadas se complementam — nenhuma substitui a outra.
#
# `$binary_remote_addr` guarda o IP em forma binária (4 bytes em IPv4), o que
# faz 10 MB comportarem cerca de 160 mil IPs distintos.
limit_req_zone $binary_remote_addr zone=ortuspixel_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=ortuspixel_admin:5m rate=2r/s;

# =============================================================================
# BLOCO 1 — HTTP (porta 80): só existe para redirecionar e renovar certificado
# =============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name ortuspixel.com www.ortuspixel.com;

    # A renovação do Let's Encrypt precisa responder em HTTP puro. Se o
    # redirect 301 abaixo capturasse TAMBÉM este caminho, a renovação
    # automática falharia — e o site cairia com certificado vencido daqui a 90
    # dias, num sábado, sem ninguém ter mudado nada. Por isso a exceção vem
    # ANTES do redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        # 301 (permanente), não 302: consolida a autoridade de SEO no endereço
        # HTTPS. Um 302 mantém o valor do link na URL antiga.
        return 301 https://ortuspixel.com$request_uri;
    }
}

# =============================================================================
# BLOCO 2 — HTTPS em www: redireciona para o domínio canônico
# =============================================================================
#
# POR QUE www É REDIRECIONADO, E NÃO SERVIDO
# Servir o mesmo conteúdo em ortuspixel.com e www.ortuspixel.com cria conteúdo
# duplicado: o Google escolhe sozinho qual indexar, os sinais de link se
# dividem entre os dois endereços e o relatório do Search Console fica partido
# ao meio. O canônico escolhido é o apex, para casar com o
# `NEXT_PUBLIC_SITE_URL=https://ortuspixel.com` — que é a URL que o app usa em
# canonical tags, sitemap, e-mails e callbacks de OAuth. Divergir aqui
# quebraria o login social.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.ortuspixel.com;

    ssl_certificate     /etc/letsencrypt/live/ortuspixel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ortuspixel.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ortuspixel.com$request_uri;
}

# =============================================================================
# BLOCO 3 — HTTPS no domínio canônico: o site de verdade
# =============================================================================
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ortuspixel.com;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/ortuspixel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ortuspixel.com/privkey.pem;

    # Estes dois arquivos são criados pelo Certbot e trazem a configuração
    # moderna de cifras e protocolos (TLS 1.2+). Usá-los em vez de escrever a
    # lista de cifras à mão é deliberado: lista de cifras copiada de um blog
    # envelhece e vira dívida de segurança silenciosa; estes são atualizados
    # junto com o pacote do Certbot.
    include     /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling: o Nginx entrega a prova de que o certificado não foi
    # revogado, poupando do navegador uma consulta extra à CA no primeiro
    # acesso. Ganho direto de latência no handshake.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # -------------------------------------------------------------------------
    # CABEÇALHOS DE SEGURANÇA — INTENCIONALMENTE AUSENTES AQUI
    # -------------------------------------------------------------------------
    # HSTS, X-Content-Type-Options, X-Frame-Options, Referrer-Policy e
    # Permissions-Policy JÁ SÃO EMITIDOS pelo `headers()` do
    # `apps/web/next.config.ts`, para todas as rotas.
    #
    # Repeti-los aqui não é redundância inofensiva: `add_header` do Nginx
    # ACRESCENTA uma segunda linha em vez de substituir. O resultado é uma
    # resposta com o mesmo cabeçalho duas vezes e, quando os valores divergem
    # (por exemplo, um `max-age` de HSTS diferente em cada lugar), o
    # comportamento varia por navegador. Pior: passariam a existir DOIS lugares
    # para editar a política, e o próximo a mexer vai atualizar só um.
    #
    # A regra deste projeto: política de segurança de aplicação mora no Next;
    # o Nginx cuida de TLS, proxy e limites de tráfego.
    #
    # A Content-Security-Policy (pendência 3 do README) também deve entrar no
    # `next.config.ts`, e não aqui — ela precisa do hash do script inline de
    # tema, que só o build do app conhece.

    # --- Limites e robustez --------------------------------------------------
    # 2 MB cobre com folga qualquer POST do site (newsletter, comentário,
    # inscrição de push). O padrão de 1 MB é apertado para upload de imagem no
    # painel, e um valor alto demais transforma o endpoint em ralo de memória.
    client_max_body_size 2m;

    # Fecha conexões de cliente lento que segura a conexão sem enviar corpo
    # (padrão do ataque Slowloris).
    client_body_timeout   15s;
    client_header_timeout 15s;

    server_tokens off;  # não anuncia a versão do Nginx na resposta e no erro

    # --- Compressão ----------------------------------------------------------
    # O Next já comprime, mas apenas o que ele mesmo gera. Ligar aqui cobre
    # tudo de forma uniforme.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;   # abaixo disso, comprimir custa mais do que economiza
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/rss+xml image/svg+xml;

    # --- Logs ----------------------------------------------------------------
    access_log /var/log/nginx/ortuspixel.access.log;
    error_log  /var/log/nginx/ortuspixel.error.log warn;

    # -------------------------------------------------------------------------
    # PROXY — configuração compartilhada
    # -------------------------------------------------------------------------
    # Repetida em cada `location` porque as diretivas `proxy_*` NÃO são
    # herdadas quando um `location` declara as suas próprias. Um `include` de
    # arquivo externo seria mais enxuto, mas exigiria um segundo arquivo para
    # copiar ao VPS — e este precisa funcionar sozinho.

    location / {
        proxy_pass http://ortuspixel_app;

        proxy_http_version 1.1;

        # `Host` original é obrigatório: o Next usa o host para montar URLs
        # absolutas. Sem isso, links de e-mail e redirects de OAuth apontariam
        # para "ortuspixel_app". (O app já se protege de host header injection
        # lendo a URL de variável de ambiente — ver README > Segurança —, mas
        # repassar o host correto continua sendo o comportamento certo.)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # CRÍTICO: sem `X-Forwarded-Proto`, o Node acredita estar em HTTP puro
        # e pode emitir cookie sem a flag `Secure` e redirects para http://,
        # gerando laço de redirecionamento com o bloco 1.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Necessário para o keepalive do upstream funcionar.
        proxy_set_header Connection "";

        # Suporte a WebSocket/SSE. Não é usado hoje, mas cobre cobertura ao
        # vivo de eventos (CCXP, Game Awards), que está na Fase 3 do roadmap.
        proxy_set_header Upgrade    $http_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # 60s cobre a regeneração de uma página ISR sob carga. Abaixo disso, o
        # leitor recebe 504 justamente durante um pico de breaking news.
        proxy_read_timeout    60s;

        # Deixa o Next mandar a resposta em streaming (RSC/Suspense) em vez de
        # o Nginx segurar tudo em buffer até o fim. Com buffer, o navegador só
        # começa a pintar depois da última linha — perde-se o ganho de
        # streaming que motivou usar Server Components.
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # ASSETS IMUTÁVEIS
    # -------------------------------------------------------------------------
    # Tudo em /_next/static tem hash de conteúdo no nome: se o arquivo muda, o
    # NOME muda. Então pode ser cacheado para sempre, sem risco de servir
    # versão velha. É o cache mais seguro e mais lucrativo que existe.
    location /_next/static/ {
        proxy_pass http://ortuspixel_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # -------------------------------------------------------------------------
    # API — limite de taxa
    # -------------------------------------------------------------------------
    location /api/ {
        # `burst=40 nodelay` permite rajada curta (uma página que dispara
        # várias chamadas ao carregar) sem punir o usuário legítimo, mas corta
        # o fluxo sustentado de um script abusivo.
        limit_req zone=ortuspixel_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://ortuspixel_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # PAINEL EDITORIAL — limite mais severo
    # -------------------------------------------------------------------------
    # O painel é protegido por segredo compartilhado (pendência 1 do README).
    # Enquanto for assim, 2 requisições/s por IP tornam a força bruta inviável
    # bem antes de o rate limit em memória do app precisar agir.
    #
    # Quando a autenticação individual entrar, considere restringir também por
    # IP de origem aqui (`allow`/`deny`) — decisão que depende de a redação ter
    # ou não IP fixo, e por isso NÃO foi presumida neste arquivo.
    location /admin {
        limit_req zone=ortuspixel_admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://ortuspixel_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
    }

    # Renovação do certificado também precisa funcionar aqui.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Bloqueia arquivos ocultos (.env, .git). O Next nunca os serviria, mas
    # esta linha é barata e cobre erro de configuração futuro — por exemplo,
    # alguém adicionando um `root` estático neste bloco.
    location ~ /\. {
        deny all;
        return 404;
    }
}
